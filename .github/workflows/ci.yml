name: Gateway Phase 1 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact declared dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test and build Gateway and SDK
        run: npm run check
      - name: Smoke-test compiled service startup validation
        run: |
          if TXBOARD_UPSTREAM_URL= node apps/gateway/dist/index.js >/tmp/txboard-gateway-boot.log 2>&1; then
            echo 'Gateway unexpectedly started without upstream URL'
            exit 1
          fi
          grep -q 'TXBOARD_UPSTREAM_URL is required' /tmp/txboard-gateway-boot.log
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -t txboard-gateway:phase1 .
      - name: Container boots with fixed upstream configuration
        run: |
          docker run -d --name txboard-gateway-test \
            -e GATEWAY_HOST=0.0.0.0 \
            -e TXBOARD_UPSTREAM_URL=https://txboard.example \
            -p 127.0.0.1:18787:8787 txboard-gateway:phase1
          trap 'docker rm -f txboard-gateway-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18787/healthz | grep -q '"contract":"1"'; then exit 0; fi
            sleep 1
          done
          docker logs txboard-gateway-test
          exit 1
