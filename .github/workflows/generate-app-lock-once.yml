name: Generate Gateway App HPKE lockfile once
on:
  push:
    branches: [feat/docker-app-hpke-preview]
    paths: [.github/workflows/generate-app-lock-once.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - name: Resolve declared versions and commit workspace lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: pin hpke and browser bundler dependencies"
          git push origin HEAD:feat/docker-app-hpke-preview
