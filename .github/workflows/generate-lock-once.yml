# Temporary one-shot lockfile generation. Removed after lockfile is committed.
name: Generate Gateway Lockfile Once
on:
  push:
    branches: [feat/gw-103-105-reproducible-e2e]
    paths: [.github/workflows/generate-lock-once.yml]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Resolve declared versions and commit npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: lock Gateway npm workspace dependency graph (GW-103)"
          git push origin HEAD:feat/gw-103-105-reproducible-e2e
