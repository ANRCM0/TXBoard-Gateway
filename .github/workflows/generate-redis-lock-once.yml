name: Generate Redis lockfile once
on:
  push:
    branches: [feat/app-workflows-redis-replay]
    paths: [.github/workflows/generate-redis-lock-once.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.2'
      - run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: pin redis security client and test deps'
          git push origin HEAD:feat/app-workflows-redis-replay
