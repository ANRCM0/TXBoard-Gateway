# Opt-in HPKE preview; requires reachable Redis replay store and a persisted private key.
# docker compose -f compose.yaml -f compose.crypto.yaml up -d --build
services:
  gateway:
    environment:
      GATEWAY_HPKE_MODE: optional
      GATEWAY_REDIS_URL: ${GATEWAY_REDIS_URL:-}
      GATEWAY_ACCOUNT_WORKFLOWS_ENABLED: ${GATEWAY_ACCOUNT_WORKFLOWS_ENABLED:-false}
      GATEWAY_HPKE_KEY_FILE: /run/secrets/gateway-hpke.json
    secrets:
      - source: gateway-hpke
        target: gateway-hpke.json
        uid: "1000"
        gid: "1000"
        mode: 0400
    # Replay is Redis-atomic across live replicas. Key rotation and Redis failover durability are NOT yet production-vetted.
secrets:
  gateway-hpke:
    file: ${GATEWAY_HPKE_SECRET_FILE:-./secrets/gateway-hpke.json}
