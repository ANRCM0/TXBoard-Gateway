# Optional gateway only. Do NOT publish the container port or replace legacy TXBoard routes.
# Attach this service to the same PRIVATE proxy network used by the TXBoard ingress.
services:
  txboard-gateway:
    build: .
    restart: unless-stopped
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8787
      TXBOARD_UPSTREAM_URL: ${TXBOARD_UPSTREAM_URL:?HTTPS upstream is required}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:?exact frontend origins are required}
    expose:
      - "8787"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    # Join the existing trusted reverse-proxy Docker network; no public ports.
